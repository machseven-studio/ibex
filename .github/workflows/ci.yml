name: IBEX CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ibex
          POSTGRES_PASSWORD: ibex
          POSTGRES_DB: ibex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibex -d ibex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ibex:ibex@localhost:5432/ibex_test
      TEST_DATABASE_URL: postgres://ibex:ibex@localhost:5432/ibex_test
      ENV: development
      IBEX_UPLOAD_DIR: /tmp/ibex-ci-uploads

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Syntax check
        run: |
          python -m py_compile main.py

      - name: Import check
        run: |
          python -c "import main; print('main.py imports OK')"

      - name: Run tests
        run: |
          pytest -q tests/
